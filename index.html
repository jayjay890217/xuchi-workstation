<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="旭馳工作台" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>旭馳工作台｜XCGS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff7a00'/%3E%3Ctext x='32' y='42' font-size='26' font-weight='900' text-anchor='middle' fill='white' font-family='Arial'%3EXC%3C/text%3E%3C/svg%3E" />
  <style>
    :root{
      --bg:#080808;
      --panel:#111214;
      --panel2:#17191c;
      --line:#292c31;
      --text:#f7f7f7;
      --muted:#9ca3af;
      --orange:#ff7a00;
      --orange2:#ff9b3d;
      --ok:#67e480;
      --danger:#ff4d4f;
      --shadow:0 14px 36px rgba(0,0,0,.35);
      --radius:24px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%}
    body{
      background:
        radial-gradient(circle at 15% 0%,rgba(255,122,0,.12),transparent 26%),
        linear-gradient(180deg,#090909 0%,#0c0d0f 100%);
      background-attachment:fixed;
      background-color:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 40px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
    .brand{display:flex;align-items:center;gap:16px}
    .logo{
      width:62px;height:62px;border-radius:18px;flex:none;
      display:grid;place-items:center;font-weight:900;font-size:22px;letter-spacing:.5px;
      background:linear-gradient(145deg,var(--orange),#ff4f00);
      box-shadow:0 10px 26px rgba(255,122,0,.25);
    }
    h1{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:900}
    .sub{color:var(--muted);font-size:14px}
    .status{
      background:#121315;border:1px solid var(--line);border-radius:999px;
      padding:10px 14px;color:#cfd3d8;font-size:13px;white-space:nowrap;
      display:flex;align-items:center;gap:8px
    }
    .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(103,228,128,.18)}
    .status.off .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(255,77,79,.2)}
    .status.off{border-color:rgba(255,77,79,.5);color:#ffd2d2}

    .offline-bar{
      display:none;margin:-10px 0 18px;padding:12px 16px;border-radius:16px;
      background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.4);color:#ffd2d2;font-size:14px;line-height:1.6
    }
    .offline-bar.show{display:block}

    .hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-bottom:18px}
    .hero-card,.clock-card{
      border:1px solid var(--line);border-radius:var(--radius);
      background:linear-gradient(145deg,#131416,#0f1012);box-shadow:var(--shadow);
    }
    .hero-card{padding:28px;position:relative;overflow:hidden}
    .hero-card:after{
      content:"";position:absolute;right:-60px;bottom:-70px;width:230px;height:230px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,122,0,.2),rgba(255,122,0,0) 70%);pointer-events:none
    }
    .eyebrow{color:var(--orange2);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
    .hero-title{font-size:34px;font-weight:900;margin:9px 0 8px}
    .hero-copy{color:#c7cbd1;max-width:680px;line-height:1.7}
    .clock-card{padding:24px;display:flex;flex-direction:column;justify-content:center}
    .time{font-size:46px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
    .date{color:var(--muted);margin-top:4px}

    .section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 14px}
    .section-title h2{margin:0;font-size:18px}
    .section-title span{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .card{
      position:relative;min-height:150px;padding:20px;border-radius:22px;border:1px solid var(--line);
      background:linear-gradient(145deg,var(--panel2),var(--panel));
      text-decoration:none;color:var(--text);display:flex;flex-direction:column;
      justify-content:space-between;box-shadow:0 8px 22px rgba(0,0,0,.22);
      transition:transform .18s ease,border-color .18s ease;
    }
    .card:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
    .card:active{transform:scale(.985)}
    @media (hover:hover){ .card:hover{border-color:#3a3d43;transform:translateY(-2px)} }
    .card.disabled{opacity:.45;cursor:not-allowed}
    .card.disabled .arrow{color:var(--muted)}
    .icon{
      width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
      background:#22252a;border:1px solid #30343a;font-size:23px
    }
    .card.orange .icon{background:rgba(255,122,0,.14);border-color:rgba(255,122,0,.35)}
    .card h3{margin:18px 0 4px;font-size:18px}
    .card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
    .arrow{margin-top:14px;color:var(--orange2);font-size:13px;font-weight:800}
    .key{
      display:none;position:absolute;top:16px;right:16px;min-width:26px;height:26px;padding:0 7px;border-radius:8px;
      border:1px solid #3a3d43;color:var(--muted);font-size:12px;font-weight:700;
      place-items:center;font-variant-numeric:tabular-nums
    }
    @media (hover:hover) and (pointer:fine){ .key{display:grid} }

    .bottom{
      margin-top:24px;padding:18px 20px;border-radius:20px;border:1px solid var(--line);
      background:#101113;display:flex;justify-content:space-between;align-items:center;gap:16px
    }
    .bottom small{color:var(--muted);line-height:1.6}
    .btn{
      border:1px solid #3a3d43;background:#17191c;color:#e8e8e8;border-radius:14px;
      padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit
    }

    @media (max-width: 900px){
      .hero{grid-template-columns:1fr}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width: 560px){
      .wrap{padding:18px 14px 28px}
      header{align-items:flex-start}
      .status span{display:none}
      h1{font-size:24px}
      .hero-title{font-size:28px}
      .grid{gap:10px}
      .card{min-height:138px;padding:16px}
      .time{font-size:38px}
      .bottom{flex-direction:column;align-items:flex-start}
    }
    @media (prefers-reduced-motion: reduce){ .card{transition:none} }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <div class="logo">XC</div>
        <div>
          <h1>旭馳工作台</h1>
          <div class="sub">XCGS · 店務管理入口</div>
        </div>
      </div>
      <div class="status" id="netStatus" role="status" aria-live="polite">
        <i class="dot"></i><span id="netText">網路連線正常</span>
      </div>
    </header>

    <div class="offline-bar" id="offlineBar">
      ⚠️ 目前沒有網路。工單請改用手機或平板上的 <b>AppSheet</b> 輸入，網路恢復後資料會自動同步。
    </div>

    <section class="hero">
      <div class="hero-card">
        <div class="eyebrow">XUCHI GROWTH SYSTEM</div>
        <div class="hero-title" id="greeting">今天要處理什麼？</div>
        <div class="hero-copy">
          工單、客戶資料、LINE 官方帳號、工作照片與試算表，都從這裡進入。
        </div>
      </div>
      <div class="clock-card">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="date">----</div>
      </div>
    </section>

    <div class="section-title">
      <h2>常用功能</h2>
      <span id="hint">點一下直接進入</span>
    </div>

    <nav class="grid" id="grid" aria-label="常用功能"></nav>

    <div class="bottom">
      <small id="footInfo">旭馳工作台</small>
      <button class="btn" type="button" onclick="location.reload()">重新整理</button>
    </div>
  </main>

  <script>
    // ====== 連結設定：只需要改這裡 ======
    // url 留空 ("") = 尚未設定，卡片會顯示灰色、不能點
    // iosOnly: true = 只在 iPad / iPhone 顯示（例如捷徑）
    const APPS = [
      {id:"line",   title:"官方LINE",      desc:"回覆客人與處理訊息",       icon:"💬", url:"https://manager.line.biz/account/@370zrkco/", orange:true},
      {id:"cloud",  title:"雲端系統",      desc:"開啟旭馳店務 工單系統",     icon:"📱", url:"https://script.google.com/macros/s/AKfycbwxbwkVqz91gwdtj7dSgj53IhMAbaURfzFegBsn1yFFO3135b9fOUfE-QU4pNtdNey8/exec", orange:true},
      {id:"photos", title:"工作照片",      desc:"進入店內照片整理入口",       icon:"📸", url:"https://photos.google.com/", orange:true},
      {id:"camera", title:"相機",          desc:"開啟 iPad 相機",            icon:"📷", url:"shortcuts://run-shortcut?name=" + encodeURIComponent("開啟相機"), orange:true, iosOnly:true},
      {id:"cust",   title:"客戶資料",      desc:"查詢會員、車牌與客戶紀錄",   icon:"👤", url:""},
      {id:"quote",  title:"報價系統",      desc:"快速建立估價與維修項目",     icon:"🧾", url:""},
      {id:"sheets", title:"Google 試算表", desc:"查看營運、進貨與工作資料",   icon:"📊", url:"https://docs.google.com/spreadsheets/"},
      {id:"rescue", title:"道路救援",      desc:"建立或查看道路救援案件",     icon:"🛟", url:""},
    ];
    const VERSION = "2026-10-01";
    // ===================================

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    const visibleApps = APPS.filter(a => !a.iosOnly || isIOS);
    const grid = document.getElementById("grid");

    let keyNo = 0;
    visibleApps.forEach(app => {
      const ready = !!app.url;
      const el = document.createElement(ready ? "a" : "div");
      el.className = "card" + (app.orange ? " orange" : "") + (ready ? "" : " disabled");
      if (ready) {
        el.href = app.url;
        // 外部網頁開在固定分頁：重複點同一個功能不會一直開新分頁
        if (/^https?:/.test(app.url)) {
          el.target = "xc_" + app.id;
          el.rel = "noopener";
        }
      } else {
        el.setAttribute("aria-disabled", "true");
      }

      const top = document.createElement("div");
      const icon = document.createElement("div");
      icon.className = "icon";
      icon.textContent = app.icon;
      const h3 = document.createElement("h3");
      h3.textContent = app.title;
      const p = document.createElement("p");
      p.textContent = app.desc;
      top.append(icon, h3, p);

      const arrow = document.createElement("div");
      arrow.className = "arrow";
      arrow.textContent = ready ? "開啟 →" : "尚未設定";

      el.append(top, arrow);

      if (ready && keyNo < 9) {
        keyNo++;
        const key = document.createElement("span");
        key.className = "key";
        key.textContent = keyNo;
        el.appendChild(key);
        el.dataset.key = String(keyNo);
      }
      grid.appendChild(el);
    });

    // 桌機：按數字鍵 1~9 直接開啟對應功能
    if (matchMedia("(hover:hover) and (pointer:fine)").matches) {
      document.getElementById("hint").textContent = "點一下或按數字鍵直接進入";
    }
    document.addEventListener("keydown", e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
      const card = grid.querySelector(`[data-key="${e.key}"]`);
      if (card) { e.preventDefault(); card.click(); }
    });

    // ====== 時鐘與問候 ======
    const clockEl = document.getElementById("clock");
    const dateEl = document.getElementById("date");
    const greetEl = document.getElementById("greeting");
    function tick(){
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
      dateEl.textContent = now.toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
      const h = now.getHours();
      greetEl.textContent = h < 11 ? "早安，今天要處理什麼？"
                          : h < 14 ? "午安，今天要處理什麼？"
                          : h < 18 ? "下午好，今天要處理什麼？"
                          : "晚上好，今天要處理什麼？";
    }
    tick();
    // 對齊到整秒再跑，避免分鐘跳動延遲
    setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - (Date.now() % 1000));

    // ====== 網路狀態（真的偵測，不是寫死） ======
    const netStatus = document.getElementById("netStatus");
    const netText = document.getElementById("netText");
    const offlineBar = document.getElementById("offlineBar");
    function updateNet(){
      const on = navigator.onLine;
      netStatus.classList.toggle("off", !on);
      netText.textContent = on ? "網路連線正常" : "網路已中斷";
      offlineBar.classList.toggle("show", !on);
    }
    addEventListener("online", updateNet);
    addEventListener("offline", updateNet);
    updateNet();

    // ====== 開機常駐頁：每天清晨自動重新整理一次 ======
    // 頁面整天開著不關，清晨重整可以拿到最新版本、清掉記憶體累積
    let lastActive = Date.now();
    ["pointerdown","keydown","touchstart"].forEach(t => addEventListener(t, () => lastActive = Date.now(), {passive:true}));
    const loadedDay = new Date().toDateString();
    setInterval(() => {
      const now = new Date();
      const idle = Date.now() - lastActive > 10 * 60 * 1000;
      if (now.toDateString() !== loadedDay && now.getHours() >= 5 && idle && navigator.onLine) {
        location.reload();
      }
    }, 60 * 1000);

    document.getElementById("footInfo").textContent =
      `旭馳工作台 · 版本 ${VERSION}` + (isIOS || !keyNo ? "" : ` · 數字鍵 1–${keyNo} 快速開啟`);
  </script>
</body>
</html>
