<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="旭馳工作台" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>旭馳工作台｜XCGS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff7a00'/%3E%3Ctext x='32' y='42' font-size='26' font-weight='900' text-anchor='middle' fill='white' font-family='Arial'%3EXC%3C/text%3E%3C/svg%3E" />
  <style>
    :root{
      --bg:#080808;
      --panel:#111214;
      --panel2:#17191c;
      --line:#292c31;
      --text:#f7f7f7;
      --muted:#9ca3af;
      --orange:#ff7a00;
      --orange2:#ff9b3d;
      --ok:#67e480;
      --danger:#ff4d4f;
      --shadow:0 14px 36px rgba(0,0,0,.35);
      --radius:24px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%}
    body{
      background:
        radial-gradient(circle at 15% 0%,rgba(255,122,0,.12),transparent 26%),
        linear-gradient(180deg,#090909 0%,#0c0d0f 100%);
      background-attachment:fixed;
      background-color:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 40px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
    .brand{display:flex;align-items:center;gap:16px}
    .logo{
      width:62px;height:62px;border-radius:18px;flex:none;
      display:grid;place-items:center;font-weight:900;font-size:22px;letter-spacing:.5px;
      background:linear-gradient(145deg,var(--orange),#ff4f00);
      box-shadow:0 10px 26px rgba(255,122,0,.25);
    }
    h1{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:900}
    .sub{color:var(--muted);font-size:14px}
    .status{
      background:#121315;border:1px solid var(--line);border-radius:999px;
      padding:10px 14px;color:#cfd3d8;font-size:13px;white-space:nowrap;
      display:flex;align-items:center;gap:8px
    }
    .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(103,228,128,.18)}
    .status.off .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(255,77,79,.2)}
    .status.off{border-color:rgba(255,77,79,.5);color:#ffd2d2}

    .offline-bar{
      display:none;margin:-10px 0 18px;padding:12px 16px;border-radius:16px;
      background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.4);color:#ffd2d2;font-size:14px;line-height:1.6
    }
    .offline-bar.show{display:block}

    .hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-bottom:18px}
    .hero-card,.clock-card{
      border:1px solid var(--line);border-radius:var(--radius);
      background:linear-gradient(145deg,#131416,#0f1012);box-shadow:var(--shadow);
    }
    .hero-card{padding:28px;position:relative;overflow:hidden}
    .hero-card:after{
      content:"";position:absolute;right:-60px;bottom:-70px;width:230px;height:230px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,122,0,.2),rgba(255,122,0,0) 70%);pointer-events:none
    }
    .eyebrow{color:var(--orange2);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
    .hero-title{font-size:34px;font-weight:900;margin:9px 0 8px}
    .hero-copy{color:#c7cbd1;max-width:680px;line-height:1.7}
    .clock-card{padding:24px;display:flex;flex-direction:column;justify-content:center}
    .time{font-size:46px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
    .date{color:var(--muted);margin-top:4px}

    .section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 14px}
    .section-title h2{margin:0;font-size:18px}
    .section-title span{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .card{
      position:relative;min-height:150px;padding:20px;border-radius:22px;border:1px solid var(--line);
      background:linear-gradient(145deg,var(--panel2),var(--panel));
      text-decoration:none;color:var(--text);display:flex;flex-direction:column;
      justify-content:space-between;box-shadow:0 8px 22px rgba(0,0,0,.22);
      transition:transform .18s ease,border-color .18s ease;
    }
    .card:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
    .card:active{transform:scale(.985)}
    @media (hover:hover){ .card:hover{border-color:#3a3d43;transform:translateY(-2px)} }
    .card.disabled{opacity:.45;cursor:not-allowed}
    .card.disabled .arrow{color:var(--muted)}
    .icon{
      width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
      background:#22252a;border:1px solid #30343a;font-size:23px
    }
    .card.orange .icon{background:rgba(255,122,0,.14);border-color:rgba(255,122,0,.35)}
    .card h3{margin:18px 0 4px;font-size:18px}
    .card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
    .arrow{margin-top:14px;color:var(--orange2);font-size:13px;font-weight:800}
    .key{
      display:none;position:absolute;top:16px;right:16px;min-width:26px;height:26px;padding:0 7px;border-radius:8px;
      border:1px solid #3a3d43;color:var(--muted);font-size:12px;font-weight:700;
      place-items:center;font-variant-numeric:tabular-nums
    }
    @media (hover:hover) and (pointer:fine){ .key{display:grid} }

    .bottom{
      margin-top:24px;padding:18px 20px;border-radius:20px;border:1px solid var(--line);
      background:#101113;display:flex;justify-content:space-between;align-items:center;gap:16px
    }
    .bottom small{color:var(--muted);line-height:1.6}
    .btn{
      border:1px solid #3a3d43;background:#17191c;color:#e8e8e8;border-radius:14px;
      padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit
    }

    @media (max-width: 900px){
      .hero{grid-template-columns:1fr}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width: 560px){
      .wrap{padding:18px 14px 28px}
      header{align-items:flex-start}
      .status span{display:none}
      h1{font-size:24px}
      .hero-title{font-size:28px}
      .grid{gap:10px}
      .card{min-height:138px;padding:16px}
      .time{font-size:38px}
      .bottom{flex-direction:column;align-items:flex-start}
    }
    @media (prefers-reduced-motion: reduce){ .card{transition:none} }

    /* ====== 店內備註 ====== */
    .hero{grid-template-columns:1.55fr .45fr}
    .greet{color:var(--orange2);font-weight:800;font-size:14px;margin-top:10px}
    .notes{padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-height:250px}
    .notes:after{display:none}
    .n-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .n-head h2{margin:0;font-size:20px;font-weight:900;flex:1;white-space:nowrap}
    .n-meta{color:var(--muted);font-size:13px}
    .n-btn{border:1px solid #3a3d43;background:#1b1d21;color:#e8e8e8;border-radius:10px;padding:7px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
    .n-btn:hover{border-color:#50545b}
    .n-btn.pri{background:var(--orange);border-color:var(--orange);color:#160a00}
    .n-btn.ok{background:#1f6f3c;border-color:#2c8a4f;color:#eafff0}
    .n-btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
    .n-btn:disabled{opacity:.5;cursor:wait}
    .n-form{display:flex;gap:10px;align-items:stretch}
    .n-form textarea{
      flex:1;min-height:52px;max-height:160px;resize:vertical;border-radius:14px;border:1px solid var(--line);
      background:#0c0d0f;color:var(--text);padding:12px 14px;font:inherit;font-size:15px;line-height:1.5
    }
    .n-form textarea:focus{outline:2px solid var(--orange);outline-offset:-1px;border-color:transparent}
    .n-form .n-btn{padding:0 18px;font-size:15px;border-radius:14px}
    .n-empty{color:var(--muted);font-size:14px;padding:6px 2px}
    .n-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .n-who .lbl{color:var(--muted);font-size:13px;font-weight:700;margin-right:2px}
    .n-who .chip{border:1px solid #3a3d43;background:#17191c;color:#e8e8e8;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
    .n-who .chip.on{background:var(--orange);border-color:var(--orange);color:#160a00}
    .n-who.need .chip{border-color:var(--orange2);animation:nudge .5s}
    .n-who .edit{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:6px 4px}
    @keyframes nudge{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
    .dlg textarea{width:100%;min-height:180px;border-radius:10px;border:1px solid var(--line);background:#0c0d0f;color:var(--text);padding:10px 12px;font:inherit;font-size:15px;line-height:1.7;resize:vertical}
    .n-sec{display:flex;flex-direction:column;gap:6px}
    .n-sec h3{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.5px}
    .n-pend{border:1px solid rgba(255,155,61,.45);background:rgba(255,122,0,.07);border-radius:14px;padding:10px 12px}
    .n-pend h3{color:var(--orange2);margin-top:0}
    .n-item{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;border-top:1px solid #1f2125}
    .n-item:first-of-type{border-top:0}
    .n-ic{font-size:18px;line-height:1.4}
    .n-body{flex:1;min-width:0;font-size:14px;line-height:1.5}
    .n-body .n-sum{font-weight:700}
    .n-body .n-txt{color:#c7cbd1;word-break:break-word;white-space:pre-wrap}
    .n-body .n-sum + .n-txt{color:var(--muted);font-size:13px}
    .n-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--muted)}
    .n-cat{border:1px solid #3a3d43;border-radius:999px;padding:1px 9px;background:#17191c;color:#dfe2e6;font:inherit;font-size:12px;cursor:pointer}
    .n-cat:disabled{cursor:default}
    .pill{border-radius:999px;padding:1px 8px;font-weight:700}
    .pill.wait{background:rgba(255,122,0,.15);color:var(--orange2)}
    .pill.sent{background:rgba(103,228,128,.12);color:var(--ok)}
    .pill.queue{background:#22252a;color:var(--muted)}
    .n-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .n-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 18px}
    .n-list{max-height:340px;overflow:auto;padding-right:4px}
    .n-warn{font-size:13px;color:var(--orange2)}

    /* ====== 對話框 ====== */
    .mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
    .mask[hidden]{display:none}
    .dlg{background:#141518;border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
    .dlg h3{margin:0 0 6px;font-size:18px}
    .dlg p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 12px}
    .dlg label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
    .dlg input,.dlg select{width:100%;border-radius:10px;border:1px solid var(--line);background:#0c0d0f;color:var(--text);padding:10px 12px;font:inherit;font-size:14px}
    .dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
    .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#22252a;border:1px solid #3a3d43;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}
    .toast.err{background:#5c1717;border-color:#a33}
    @media (max-width: 900px){ .hero{grid-template-columns:1fr} .clock-card{flex-direction:row;align-items:baseline;gap:14px;flex-wrap:wrap} }
    @media (max-width: 560px){ .notes{padding:16px} .n-form{flex-direction:column} .n-form .n-btn{padding:12px} }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <div class="logo">XC</div>
        <div>
          <h1>旭馳工作台</h1>
          <div class="sub">XCGS · 店務管理入口</div>
        </div>
      </div>
      <div class="status" id="netStatus" role="status" aria-live="polite">
        <i class="dot"></i><span id="netText">網路連線正常</span>
      </div>
    </header>

    <div class="offline-bar" id="offlineBar">
      ⚠️ 目前沒有網路。工單請改用手機或平板上的 <b>AppSheet</b> 輸入，網路恢復後資料會自動同步。
    </div>

    <section class="hero">
      <div class="hero-card notes" id="notes">
        <div class="n-head">
          <h2>📋 店內備註</h2>
          <span class="n-meta" id="nMeta"></span>
          <button class="n-btn" type="button" id="nSend" title="把還沒發送的備註立刻整理後傳給櫃台">立即發送</button>
          <button class="n-btn ghost" type="button" id="nRefresh" title="重新讀取">↻</button>
          <button class="n-btn ghost" type="button" id="nCfgBtn" title="備註設定">⚙</button>
        </div>
        <div class="n-who" id="nWho"></div>
        <form class="n-form" id="nForm" autocomplete="off">
          <textarea id="nText" rows="2" placeholder="例：小陳預支 3000｜跟規速調了 2 罐 F8200｜阿明自己裝了來令片｜DRG 空濾沒了｜幫王先生叫火星塞　（Enter 送出，Shift+Enter 換行）"></textarea>
          <button class="n-btn pri" type="submit" id="nAdd">新增</button>
        </form>
        <div id="nBox"><div class="n-empty">讀取中…</div></div>
      </div>
      <div class="clock-card">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="date">----</div>
        <div class="greet" id="greeting"></div>
      </div>
    </section>

    <div class="section-title">
      <h2>常用功能</h2>
      <span id="hint">點一下直接進入</span>
    </div>

    <nav class="grid" id="grid" aria-label="常用功能"></nav>

    <div class="bottom">
      <small id="footInfo">旭馳工作台</small>
      <div style="display:flex;gap:8px">
        <button class="btn" type="button" id="linkEditBtn">編輯連結</button>
        <button class="btn" type="button" onclick="location.reload()">重新整理</button>
      </div>
    </div>
  </main>

  <!-- 備註設定 -->
  <div class="mask" id="nCfg" hidden>
    <div class="dlg">
      <h3>備註設定</h3>
      <p>輸入 Apps Script「旭馳 LINE 通知」指令碼屬性裡的 <b>NOTE_KEY</b>。只會存在這台電腦的瀏覽器，不會放上 GitHub。</p>
      <label for="nKeyIn">備註密碼（NOTE_KEY）</label>
      <input id="nKeyIn" type="password" autocomplete="off">
      <div class="acts">
        <button class="n-btn ghost" type="button" id="nCfgCancel">取消</button>
        <button class="n-btn pri" type="button" id="nCfgSave">儲存</button>
      </div>
    </div>
  </div>

  <!-- 備註人員 -->
  <div class="mask" id="staffDlg" hidden>
    <div class="dlg">
      <h3>備註人員</h3>
      <p>一行一位。所有電腦、平板共用這份名單。</p>
      <textarea id="staffIn" spellcheck="false"></textarea>
      <div class="acts">
        <button class="n-btn ghost" type="button" id="staffCancel">取消</button>
        <button class="n-btn pri" type="button" id="staffSave">儲存</button>
      </div>
    </div>
  </div>

  <!-- 編輯連結 -->
  <div class="mask" id="linkDlg" hidden>
    <div class="dlg">
      <h3>編輯連結</h3>
      <p>貼上網址就會出現在首頁，只存在這台電腦。清空 = 回到預設。</p>
      <div id="linkRows"></div>
      <div class="acts">
        <button class="n-btn ghost" type="button" id="linkCancel">取消</button>
        <button class="n-btn pri" type="button" id="linkSave">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // ====== 連結設定：只需要改這裡 ======
    // url 留空 ("") = 尚未設定，卡片會顯示灰色、不能點（也可以在頁面最下方「編輯連結」貼網址）
    // win: true    = 開在獨立視窗（不是分頁）
    // iosOnly: true = 只在 iPad / iPhone 顯示（例如捷徑）
    const APPSHEET_SALES = "https://www.appsheet.com/start/652dbbcb-f80e-4c81-a001-4ec92646882d#appName=NewApp-894803302-26-02-21-4&view=" + encodeURIComponent("業績總覽");
    const APPS = [
      {id:"line",   title:"官方LINE",      desc:"回覆客人與處理訊息",         icon:"💬", url:"https://manager.line.biz/account/@370zrkco/", orange:true},
      {id:"cloud",  title:"雲端系統",      desc:"開啟旭馳店務 工單系統",       icon:"📱", url:"https://script.google.com/macros/s/AKfycbwxbwkVqz91gwdtj7dSgj53IhMAbaURfzFegBsn1yFFO3135b9fOUfE-QU4pNtdNey8/exec", orange:true},
      {id:"sales",  title:"AppSheet 業績", desc:"業績總覽，獨立視窗查詢",       icon:"📈", url:APPSHEET_SALES, orange:true, win:true},
      {id:"hbs",    title:"好幫手",        desc:"SYM 頭家好幫手 KEY 單",       icon:"🛵", url:"https://cert.sym.com.tw:8443/cas/login?service=https%3A%2F%2Fsmile2.sym.com.tw%2FeNews%2Fpage1%2FviewDetail.do%3FdocId%3D11168%26curPagNum%3D1%26pageSize%3D5", orange:true, win:true},
      {id:"ecpay",  title:"綠界系統",      desc:"金流、發票後台",              icon:"💳", url:"https://vendor.ecpay.com.tw/", win:true},
      {id:"daka",   title:"打卡之星",      desc:"員工出勤與打卡紀錄",          icon:"⏰", url:"https://teaches.cc/admin/login", win:true},
      {id:"google", title:"Google Chrome", desc:"開一個新的瀏覽器視窗",        icon:"🌐", url:"https://www.google.com/", win:true},
      {id:"photos", title:"工作照片",      desc:"進入店內照片整理入口",         icon:"📸", url:"https://photos.google.com/"},
      {id:"camera", title:"相機",          desc:"開啟 iPad 相機",              icon:"📷", url:"shortcuts://run-shortcut?name=" + encodeURIComponent("開啟相機"), iosOnly:true},
      {id:"cust",   title:"客戶資料",      desc:"查詢會員、車牌與客戶紀錄",     icon:"👤", url:""},
      {id:"quote",  title:"報價系統",      desc:"快速建立估價與維修項目",       icon:"🧾", url:""},
      {id:"sheets", title:"Google 試算表", desc:"查看營運、進貨與工作資料",     icon:"📊", url:"https://docs.google.com/spreadsheets/"},
      {id:"stock", title:"SYM車台切結書", desc:"車台&CASE共用", icon:"📊", url:"https://docs.google.com/spreadsheets/d/1MHEPRTRaz_BhTW0SrIsF9q183i_O2n7DtXhtwRqVnYo/edit?usp=drive_link", win:true},
    ];
    const VERSION = "2026-10-02b";
    // ===================================

    const $ = id => document.getElementById(id);
    const store = {
      get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
      set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
    };
    function toast(msg, err){
      const t = document.createElement("div");
      t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4500 : 2200);
    }

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const visibleApps = APPS.filter(a => !a.iosOnly || isIOS);
    const grid = $("grid");
    const urlOf = app => (store.get("xc_links", {})[app.id] || app.url || "").trim();

    // 獨立視窗：同一個功能重複點會回到同一個視窗
    function openWin(app, url){
      const w = Math.min(1440, screen.availWidth - 40), h = Math.min(960, screen.availHeight - 60);
      const left = Math.max(0, (screen.availWidth - w) / 2), top = Math.max(0, (screen.availHeight - h) / 2);
      const win = window.open(url, "xcw_" + app.id, `popup=yes,width=${w},height=${h},left=${left},top=${top}`);
      if (win) { try { win.focus(); } catch(e){} }
      else window.open(url, "xc_" + app.id); // 視窗被擋就改開分頁
    }

    let keyNo = 0;
    function renderGrid(){
      grid.textContent = "";
      keyNo = 0;
      visibleApps.forEach(app => {
        const url = urlOf(app);
        const ready = !!url;
        const el = document.createElement(ready ? "a" : "div");
        el.className = "card" + (app.orange ? " orange" : "") + (ready ? "" : " disabled");
        if (ready) {
          el.href = url;
          if (/^https?:/.test(url)) {
            // 外部網頁開在固定分頁：重複點同一個功能不會一直開新分頁
            el.target = "xc_" + app.id;
            el.rel = "noopener";
            if (app.win && !isIOS) el.addEventListener("click", e => { e.preventDefault(); openWin(app, url); });
          }
        } else {
          el.setAttribute("aria-disabled", "true");
          el.title = "按頁面最下方「編輯連結」貼上網址";
        }

        const top = document.createElement("div");
        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = app.icon;
        const h3 = document.createElement("h3");
        h3.textContent = app.title;
        const p = document.createElement("p");
        p.textContent = app.desc;
        top.append(icon, h3, p);

        const arrow = document.createElement("div");
        arrow.className = "arrow";
        arrow.textContent = ready ? (app.win && !isIOS ? "開新視窗 ↗" : "開啟 →") : "尚未設定";

        el.append(top, arrow);

        if (ready && keyNo < 9) {
          keyNo++;
          const key = document.createElement("span");
          key.className = "key";
          key.textContent = keyNo;
          el.appendChild(key);
          el.dataset.key = String(keyNo);
        }
        grid.appendChild(el);
      });
      $("footInfo").textContent =
        `旭馳工作台 · 版本 ${VERSION}` + (isIOS || !keyNo ? "" : ` · 數字鍵 1–${keyNo} 快速開啟`);
    }
    renderGrid();

    // ====== 編輯連結（存在這台電腦） ======
    $("linkEditBtn").onclick = () => {
      const saved = store.get("xc_links", {});
      const rows = $("linkRows"); rows.textContent = "";
      visibleApps.forEach(app => {
        const lb = document.createElement("label");
        lb.textContent = app.icon + " " + app.title + (app.url ? "（預設已設定）" : "");
        lb.htmlFor = "lk_" + app.id;
        const inp = document.createElement("input");
        inp.id = "lk_" + app.id; inp.dataset.id = app.id; inp.type = "url";
        inp.placeholder = app.url || "https://…"; inp.value = saved[app.id] || "";
        rows.append(lb, inp);
      });
      $("linkDlg").hidden = false;
    };
    $("linkCancel").onclick = () => { $("linkDlg").hidden = true; };
    $("linkSave").onclick = () => {
      const next = {};
      let bad = "";
      $("linkRows").querySelectorAll("input").forEach(inp => {
        const v = inp.value.trim();
        if (!v) return;
        if (!/^(https?|shortcuts):\/\//i.test(v)) bad = bad || inp.dataset.id;
        next[inp.dataset.id] = v;
      });
      if (bad) return toast("網址要以 https:// 開頭", true);
      if (!store.set("xc_links", next)) return toast("這個瀏覽器不能儲存設定", true);
      $("linkDlg").hidden = true; renderGrid(); toast("連結已更新");
    };

    // 桌機：按數字鍵 1~9 直接開啟對應功能
    if (matchMedia("(hover:hover) and (pointer:fine)").matches) {
      document.getElementById("hint").textContent = "點一下或按數字鍵直接進入";
    }
    document.addEventListener("keydown", e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
      const card = grid.querySelector(`[data-key="${e.key}"]`);
      if (card) { e.preventDefault(); card.click(); }
    });

    // ====== 時鐘與問候 ======
    const clockEl = document.getElementById("clock");
    const dateEl = document.getElementById("date");
    const greetEl = document.getElementById("greeting");
    function tick(){
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
      dateEl.textContent = now.toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
      const h = now.getHours();
      greetEl.textContent = h < 11 ? "早安，今天要處理什麼？"
                          : h < 14 ? "午安，今天要處理什麼？"
                          : h < 18 ? "下午好，今天要處理什麼？"
                          : "晚上好，今天要處理什麼？";
    }
    tick();
    // 對齊到整秒再跑，避免分鐘跳動延遲
    setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - (Date.now() % 1000));

    // ====== 網路狀態（真的偵測，不是寫死） ======
    const netStatus = document.getElementById("netStatus");
    const netText = document.getElementById("netText");
    const offlineBar = document.getElementById("offlineBar");
    function updateNet(){
      const on = navigator.onLine;
      netStatus.classList.toggle("off", !on);
      netText.textContent = on ? "網路連線正常" : "網路已中斷";
      offlineBar.classList.toggle("show", !on);
    }
    addEventListener("online", updateNet);
    addEventListener("offline", updateNet);
    updateNet();

    // ====== 開機常駐頁：每天清晨自動重新整理一次 ======
    // 頁面整天開著不關，清晨重整可以拿到最新版本、清掉記憶體累積
    let lastActive = Date.now();
    ["pointerdown","keydown","touchstart"].forEach(t => addEventListener(t, () => lastActive = Date.now(), {passive:true}));
    const loadedDay = new Date().toDateString();
    setInterval(() => {
      const now = new Date();
      const idle = Date.now() - lastActive > 10 * 60 * 1000;
      if (now.toDateString() !== loadedDay && now.getHours() >= 5 && idle && navigator.onLine) {
        location.reload();
      }
    }, 60 * 1000);

    // ====== 店內備註（Apps Script「旭馳 LINE 通知」→ 試算表 → LINE） ======
    const NOTE_API = "https://script.google.com/macros/s/AKfycbyVjERGN67aKNq1EkQ1cAPdBIothQcNjQTJBAlL6-HPWO_Cc_h3jIFy1CRQ5ZcG-spR/exec";
    const N_CATS = ["預支","調撥","員工自用","缺貨","叫貨","其他"];
    const N_ICON = {"預支":"💵","調撥":"🔄","員工自用":"🧑‍🔧","缺貨":"📦","叫貨":"🛒","其他":"📝"};
    const N_CONFIRM = {"預支":true,"調撥":true};
    const N = { notes:[], hours:[], staff:[], who:"", ready:true, loading:false, err:"" };

    async function napi(type, body){
      const key = store.get("xc_note_key", "");
      if (!key) { const e = new Error("請先按 ⚙ 輸入備註密碼"); e.needKey = true; throw e; }
      const r = await fetch(NOTE_API + "?type=" + encodeURIComponent(type), {
        method: "POST", body: JSON.stringify(Object.assign({}, body || {}, { key }))
      });
      let j;
      try { j = await r.json(); } catch (e) { throw new Error("備註系統沒有回應（請確認 Apps Script 已部署新版本）"); }
      if (!j.ok) {
        const e = new Error(j.error === "unauthorized" ? "備註密碼不正確，請按 ⚙ 重新輸入" : (j.error || "發生錯誤"));
        e.needKey = j.error === "unauthorized"; throw e;
      }
      return j;
    }
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const hm = s => String(s || "").slice(11, 16);
    const md = s => String(s || "").slice(5, 10).replace("-", "/");

    function nextSendText(){
      if (!N.hours.length) return "";
      const h = new Date().getHours();
      const nx = N.hours.find(x => x > h);
      return "下次彙整 " + (nx === undefined ? "明天 " + N.hours[0] : nx) + ":00";
    }

    function noteRow(n, today){
      const pend = n.status === "待確認";
      const state = pend ? '<span class="pill wait">待確認</span>'
        : n.sent ? `<span class="pill sent">已發送 ${esc(hm(n.sent))}</span>`
        : '<span class="pill queue">等待彙整</span>';
      const day = n.created.slice(0, 10) === today ? "" : md(n.created) + " ";
      const canEdit = !n.sent;
      const catSel = canEdit
        ? `<select class="n-cat" data-cat="${esc(n.id)}" title="改分類">${N_CATS.map(c => `<option${c === n.cat ? " selected" : ""}>${c}</option>`).join("")}</select>`
        : `<span class="n-cat">${esc(n.cat)}</span>`;
      const dirSel = n.cat === "調撥" && canEdit
        ? `<select class="n-cat" data-dir="${esc(n.id)}" title="調撥方向">${["","規速→旭馳","旭馳→規速"].map(d => `<option value="${d}"${d === n.dir ? " selected" : ""}>${d || "方向？"}</option>`).join("")}</select>`
        : (n.dir ? `<span>${esc(n.dir)}</span>` : "");
      const acts = (pend ? `<button class="n-btn ok" data-ok="${esc(n.id)}">確認發送</button>` : "")
        + (canEdit ? `<button class="n-btn ghost" data-del="${esc(n.id)}" title="刪除">✕</button>` : "");
      return `<div class="n-item">
        <div class="n-ic">${N_ICON[n.cat] || "📝"}</div>
        <div class="n-body">
          ${n.summary ? `<div class="n-sum">${esc(n.summary)}</div>` : ""}
          <div class="n-txt">${esc(n.text)}</div>
          <div class="n-sub">${catSel}${dirSel}<span>${esc([n.person, day + hm(n.created)].filter(Boolean).join(" · "))}</span>${state}</div>
        </div>
        ${acts ? `<div class="n-acts">${acts}</div>` : ""}
      </div>`;
    }

    function renderWho(){
      const w = $("nWho");
      if (N.err || !N.staff.length) { w.textContent = ""; return; }
      if (N.who && !N.staff.includes(N.who)) N.who = "";
      w.innerHTML = '<span class="lbl">誰寫的</span>'
        + N.staff.map(p => `<button type="button" class="chip${p === N.who ? " on" : ""}" data-who="${esc(p)}">${esc(p)}</button>`).join("")
        + '<button type="button" class="edit" id="staffBtn" title="編輯人員名單">✎ 人員</button>';
    }
    function renderNotes(){
      renderWho();
      const box = $("nBox");
      $("nMeta").textContent = N.err ? "" : [nextSendText(), N.ai ? "AI 分類" : ""].filter(Boolean).join(" · ");
      if (N.err) {
        box.innerHTML = `<div class="n-warn">${esc(N.err)}</div>`;
        return;
      }
      const today = N.today || "";
      const pend = N.notes.filter(n => n.status === "待確認");
      const rest = N.notes.filter(n => n.status !== "待確認");
      let html = "";
      if (!N.ready) html += '<div class="n-warn">⚠️ 還沒設定 LINE 收件人（Apps Script 指令碼屬性 NOTE_TO），備註會先存著，設定後才會發送。</div>';
      if (pend.length) {
        html += `<div class="n-sec n-pend"><h3>⏳ 預支／調撥 待確認（${pend.length}）— 確認後才會發到專屬聊天室</h3>${pend.map(n => noteRow(n, today)).join("")}</div>`;
      }
      if (rest.length) {
        const groups = N_CATS.map(c => [c, rest.filter(n => n.cat === c)]).filter(g => g[1].length);
        html += '<div class="n-list n-groups">' + groups.map(([c, list]) =>
          `<div class="n-sec"><h3>${N_ICON[c]} ${c}（${list.length}）</h3>${list.map(n => noteRow(n, today)).join("")}</div>`).join("") + "</div>";
      }
      if (!pend.length && !rest.length) html += '<div class="n-empty">今天還沒有備註。預支、調撥、員工自用、缺貨、叫貨都可以寫在這裡，系統會自動分類並定時傳給櫃台。</div>';
      box.innerHTML = html;
    }

    async function loadNotes(quiet){
      if (N.loading) return;
      N.loading = true;
      try {
        const j = await napi("note-list");
        Object.assign(N, { notes: j.notes || [], hours: j.hours || [], staff: j.staff || N.staff, ready: !!j.ready, ai: !!j.ai, today: j.today, err: "" });
      } catch (e) {
        N.err = e.message;
        if (!quiet && !e.needKey) toast(e.message, true);
      } finally {
        N.loading = false; renderNotes();
      }
    }

    function upsert(n){
      const i = N.notes.findIndex(x => x.id === n.id);
      if (i >= 0) N.notes[i] = n; else N.notes.unshift(n);
    }

    $("nForm").onsubmit = async e => {
      e.preventDefault();
      const text = $("nText").value.trim();
      if (!text) return $("nText").focus();
      if (!N.who) {
        const w = $("nWho"); w.classList.remove("need"); void w.offsetWidth; w.classList.add("need");
        return toast("請先點選是誰寫的", true);
      }
      const btn = $("nAdd"); btn.disabled = true; btn.textContent = "分類中…";
      try {
        const j = await napi("note-add", { text, person: N.who });
        upsert(j.note); N.err = ""; renderNotes();
        $("nText").value = "";
        N.who = ""; renderWho(); // 每則都要重新選人，才不會記到別人頭上
        toast(N_CONFIRM[j.note.cat] ? `已新增（${j.note.cat}，確認後才會發送）` : `已新增到「${j.note.cat}」`);
      } catch (err) {
        toast(err.message, true);
        if (err.needKey) openNoteCfg();
      } finally { btn.disabled = false; btn.textContent = "新增"; $("nText").focus(); }
    };
    $("nText").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("nForm").requestSubmit(); }
    });

    $("nBox").addEventListener("click", async e => {
      const ok = e.target.closest("[data-ok]"), del = e.target.closest("[data-del]");
      if (ok) {
        const n = N.notes.find(x => x.id === ok.dataset.ok);
        if (!n) return;
        if (n.cat === "調撥" && !n.dir && !confirm("還沒選調撥方向，確定直接發送？")) return;
        if (!confirm(`確認後會發送到專屬聊天室：\n\n${n.text}`)) return;
        ok.disabled = true; ok.textContent = "發送中…";
        try { const j = await napi("note-confirm", { id: n.id }); upsert(j.note); renderNotes(); toast("已確認並發送"); }
        catch (err) { toast(err.message, true); ok.disabled = false; ok.textContent = "確認發送"; }
      } else if (del) {
        const n = N.notes.find(x => x.id === del.dataset.del);
        if (!n || !confirm(`刪除這則備註？\n\n${n.text}`)) return;
        try { await napi("note-delete", { id: n.id }); N.notes = N.notes.filter(x => x.id !== n.id); renderNotes(); toast("已刪除"); }
        catch (err) { toast(err.message, true); }
      }
    });
    $("nBox").addEventListener("change", async e => {
      const c = e.target.closest("[data-cat]"), d = e.target.closest("[data-dir]");
      const id = c ? c.dataset.cat : d ? d.dataset.dir : "";
      if (!id) return;
      try {
        const j = await napi("note-update", c ? { id, cat: c.value } : { id, dir: d.value });
        upsert(j.note); renderNotes(); toast("已更新");
      } catch (err) { toast(err.message, true); loadNotes(true); }
    });

    $("nSend").onclick = async () => {
      const btn = $("nSend");
      const waiting = N.notes.filter(n => n.status === "一般" && !n.sent).length;
      if (!waiting) return toast("沒有等待彙整的備註（預支／調撥請按「確認發送」）");
      if (!confirm(`現在把 ${waiting} 則備註整理後傳給櫃台？`)) return;
      btn.disabled = true;
      try { const j = await napi("note-send"); toast(j.sent ? `已發送 ${j.sent} 則` : (j.message || "沒有需要發送的備註")); await loadNotes(true); }
      catch (err) { toast(err.message, true); }
      finally { btn.disabled = false; }
    };
    $("nRefresh").onclick = () => loadNotes(false);

    $("nWho").addEventListener("click", e => {
      const c = e.target.closest("[data-who]");
      if (c) { N.who = N.who === c.dataset.who ? "" : c.dataset.who; $("nWho").classList.remove("need"); renderWho(); $("nText").focus(); return; }
      if (e.target.closest("#staffBtn")) { $("staffIn").value = N.staff.join("\n"); $("staffDlg").hidden = false; $("staffIn").focus(); }
    });
    $("staffCancel").onclick = () => { $("staffDlg").hidden = true; };
    $("staffSave").onclick = async () => {
      const btn = $("staffSave"); btn.disabled = true;
      try {
        const j = await napi("note-staff", { staff: $("staffIn").value });
        N.staff = j.staff; $("staffDlg").hidden = true; renderWho(); toast("人員名單已更新");
      } catch (err) { toast(err.message, true); }
      finally { btn.disabled = false; }
    };

    function openNoteCfg(){ $("nKeyIn").value = store.get("xc_note_key", ""); $("nCfg").hidden = false; $("nKeyIn").focus(); }
    $("nCfgBtn").onclick = openNoteCfg;
    $("nCfgCancel").onclick = () => { $("nCfg").hidden = true; };
    $("nCfgSave").onclick = () => {
      if (!store.set("xc_note_key", $("nKeyIn").value.trim())) return toast("這個瀏覽器不能儲存設定", true);
      $("nCfg").hidden = true; loadNotes(false);
    };
    $("nKeyIn").addEventListener("keydown", e => { if (e.key === "Enter") $("nCfgSave").click(); });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") document.querySelectorAll(".mask").forEach(m => { m.hidden = true; });
    });

    loadNotes(true);
    // 其他電腦或平板新增的備註也同步過來
    setInterval(() => { if (!document.hidden && !document.querySelector(".mask:not([hidden])")) loadNotes(true); }, 2 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadNotes(true); });
  </script>
</body>
</html>
