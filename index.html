<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="旭馳工作台" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>旭馳工作台｜XCGS</title>
  <style>
    :root{
      --bg:#080808;
      --panel:#111214;
      --panel2:#17191c;
      --line:#292c31;
      --text:#f7f7f7;
      --muted:#9ca3af;
      --orange:#ff7a00;
      --orange2:#ff9b3d;
      --danger:#ff4d4f;
      --shadow:0 14px 36px rgba(0,0,0,.35);
      --radius:24px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:
      radial-gradient(circle at 15% 0%,rgba(255,122,0,.12),transparent 26%),
      linear-gradient(180deg,#090909 0%,#0c0d0f 100%);
      color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Noto Sans TC",sans-serif;
      min-height:100%;
    }
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 40px}
    header{
      display:flex;align-items:center;justify-content:space-between;gap:20px;
      margin-bottom:26px;
    }
    .brand{display:flex;align-items:center;gap:16px}
    .logo{
      width:62px;height:62px;border-radius:18px;
      display:grid;place-items:center;font-weight:900;font-size:22px;letter-spacing:.5px;
      background:linear-gradient(145deg,var(--orange),#ff4f00);
      box-shadow:0 10px 26px rgba(255,122,0,.25);
    }
    h1{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:900}
    .sub{color:var(--muted);font-size:14px}
    .status{
      background:#121315;border:1px solid var(--line);border-radius:999px;
      padding:10px 14px;color:#cfd3d8;font-size:13px;white-space:nowrap
    }
    .status b{color:#67e480}
    .hero{
      display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-bottom:18px;
    }
    .hero-card,.clock-card{
      border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,#131416,#0f1012);
      box-shadow:var(--shadow);
    }
    .hero-card{padding:28px;position:relative;overflow:hidden}
    .hero-card:after{
      content:"";position:absolute;right:-60px;bottom:-70px;width:230px;height:230px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,122,0,.2),rgba(255,122,0,0) 70%);
    }
    .eyebrow{color:var(--orange2);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
    .hero-title{font-size:34px;font-weight:900;margin:9px 0 8px}
    .hero-copy{color:#c7cbd1;max-width:680px;line-height:1.7}
    .clock-card{padding:24px;display:flex;flex-direction:column;justify-content:center}
    .time{font-size:46px;font-weight:900;letter-spacing:-1.5px}
    .date{color:var(--muted);margin-top:4px}

    .section-title{
      display:flex;align-items:center;justify-content:space-between;margin:28px 2px 14px
    }
    .section-title h2{margin:0;font-size:18px}
    .section-title span{color:var(--muted);font-size:13px}
    .grid{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;
    }
    .card{
      min-height:150px;padding:20px;border-radius:22px;border:1px solid var(--line);
      background:linear-gradient(145deg,var(--panel2),var(--panel));
      text-decoration:none;color:var(--text);display:flex;flex-direction:column;
      justify-content:space-between;box-shadow:0 8px 22px rgba(0,0,0,.22);
      transition:.18s ease;
    }
    .card:active{transform:scale(.985)}
    .card:hover{border-color:#3a3d43;transform:translateY(-2px)}
    .icon{
      width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
      background:#22252a;border:1px solid #30343a;font-size:23px
    }
    .card.orange .icon{background:rgba(255,122,0,.14);border-color:rgba(255,122,0,.35)}
    .card h3{margin:18px 0 4px;font-size:18px}
    .card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
    .arrow{margin-top:14px;color:var(--orange2);font-size:13px;font-weight:800}
    .bottom{
      margin-top:24px;padding:18px 20px;border-radius:20px;border:1px solid var(--line);
      background:#101113;display:flex;justify-content:space-between;align-items:center;gap:16px
    }
    .bottom small{color:var(--muted);line-height:1.6}
    .admin{
      border:1px solid #3a3d43;background:#17191c;color:#e8e8e8;border-radius:14px;
      padding:11px 14px;font-weight:700
    }

    @media (max-width: 900px){
      .hero{grid-template-columns:1fr}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width: 560px){
      .wrap{padding:18px 14px 28px}
      header{align-items:flex-start}
      .status{display:none}
      h1{font-size:24px}
      .hero-title{font-size:28px}
      .grid{grid-template-columns:1fr 1fr;gap:10px}
      .card{min-height:138px;padding:16px}
      .time{font-size:38px}
      .bottom{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <div class="logo">XC</div>
        <div>
          <h1>旭馳工作台</h1>
          <div class="sub">XCGS · 店務管理入口</div>
        </div>
      </div>
      <div class="status">系統狀態：<b>● 正常</b></div>
    </header>

    <section class="hero">
      <div class="hero-card">
        <div class="eyebrow">XUCHI GROWTH SYSTEM</div>
        <div class="hero-title">今天要處理什麼？</div>
        <div class="hero-copy">
          從這裡進入客戶資料、AppSheet、報價、LINE OA、工作照片與試算表。
          之後所有店內 iPad 都可以使用同一個首頁。
        </div>
      </div>
      <div class="clock-card">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="date">----</div>
      </div>
    </section>

    <div class="section-title">
      <h2>常用功能</h2>
      <span>點一下直接進入</span>
    </div>

    <section class="grid" id="grid"></section>

    <div class="bottom">
      <small>
        第一版工作台。把下面程式碼中的連結改成你的 AppSheet、Google 試算表、LIFF 或其他網址即可。
      </small>
      <button class="admin" onclick="showConfig()">查看連結設定位置</button>
    </div>
  </main>

  <script>
    // ====== 只需要改這裡的網址 ======
    const APPS = [
      {title:"官方LINE", desc:"回覆客人與處理訊息", icon:"💬", url:"https://manager.line.biz/account/@370zrkco/", orange:true},
      {title:"雲端系統", desc:"開啟旭馳店務 工單系統", icon:"📱", url:"https://script.google.com/macros/s/AKfycbwxbwkVqz91gwdtj7dSgj53IhMAbaURfzFegBsn1yFFO3135b9fOUfE-QU4pNtdNey8/exec", orange:true},
      {title:"工作照片", desc:"進入店內照片整理入口", icon:"📸", url:"https://photos.google.com/", orange:true},
      {title:"相機", desc:"開啟 iPad 相機", icon:"📷", url:"shortcuts://run-shortcut?name=開啟相機", orange:true},
      {title:"客戶資料", desc:"查詢會員、車牌與客戶紀錄", icon:"👤", url:"https://example.com/customer", orange:false},
      {title:"報價系統", desc:"快速建立估價與維修項目", icon:"🧾", url:"https://example.com/quote", orange:false},
      {title:"Google 試算表", desc:"查看營運、進貨與工作資料", icon:"📊", url:"https://docs.google.com/spreadsheets/", orange:false},
      {title:"道路救援", desc:"建立或查看道路救援案件", icon:"🛟", url:"https://example.com/rescue", orange:false},
    ];
    // ==============================

    const grid = document.getElementById("grid");
    APPS.forEach(app=>{
      const a = document.createElement("a");
      a.className = "card" + (app.orange ? " orange" : "");
      a.href = app.url;
      a.target = "_blank";
      a.innerHTML = `
        <div>
          <div class="icon">${app.icon}</div>
          <h3>${app.title}</h3>
          <p>${app.desc}</p>
        </div>
        <div class="arrow">開啟 →</div>
      `;
      grid.appendChild(a);
    });

    function tick(){
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
      document.getElementById("date").textContent =
        now.toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
    }
    tick();
    setInterval(tick, 1000);

    function showConfig(){
      alert("請在 HTML 裡搜尋：const APPS = [\\n把每個 url 改成你的實際網址即可。");
    }
  </script>
</body>
</html>
